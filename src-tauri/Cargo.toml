[package]
name = "mic-monitor"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
core-foundation = "0.10"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSScreen", "NSWindow", "NSResponder", "NSWorkspace", "NSRunningApplication", "libc"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSGeometry", "NSArray", "NSValue", "NSUUID", "NSString", "NSDictionary", "NSError", "NSURL", "NSFileManager"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
tauri-plugin-single-instance = "2"
cpal = "0.18.2"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "block2", "dispatch2", "objc2", "objc2-core-audio-types", "objc2-foundation"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "objc2", "CoreAudioBaseTypes"] }
chrono = "0.4"
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "objc2-core-audio-types", "AVAudioFile", "AVAudioFormat", "AVAudioBuffer", "AVAudioSettings", "AVAudioTypes"] }
signal-hook = "0.3"
